<section id="vista-alimentos" class="vista">
        <div class="titulo-vista"><span class="etiqueta-seccion">ADMINISTRACIÓN DE ALIMENTOS</span><h2>Registro de alimentos</h2><p>Ingreso, modificación, eliminación y registro de pérdidas.</p></div>
        <div class="modulo-grid">
          <article class="panel panel-form">
            <div class="encabezado-panel"><div><span class="etiqueta-seccion">3.1 / 3.2</span><h3>Registrar / modificar alimento</h3></div></div>
            <form id="formAlimento" style="padding-top:18px;">
              <input type="hidden" id="alimentoId">
              <div class="form-grid">
                <div class="campo"><label>Nombre del alimento</label><input id="alimentoNombre" required></div>
                <div class="campo"><label>Categoría</label><select id="alimentoCategoria"><option>Lácteos</option><option>Granos</option><option>Verduras</option><option>Frutas</option><option>Cárnicos</option><option>Otros</option></select></div>
                <div class="campo"><label>Cantidad</label><input id="alimentoCantidad" type="number" min="0" required></div>
                <div class="campo"><label>Fecha de vencimiento</label><input id="alimentoVencimiento" type="date" required></div>
                <div class="campo"><label>Sede</label><select id="alimentoSede"><option>Sede principal</option><option>Sede norte</option><option>Sede sur</option></select></div>
              </div>
              <div class="acciones"><button class="boton-principal" type="submit">Guardar alimento</button><button class="boton-secundario" type="button" onclick="limpiarAlimento()">Limpiar</button></div>
              <div id="mensajeAlimento" class="mensaje"></div>
            </form>
          </article>

          <article class="panel panel-form">
            <div class="encabezado-panel"><div><span class="etiqueta-seccion">3.3</span><h3>Registrar pérdida de alimento</h3></div></div>
            <form id="formPerdida" style="padding-top:18px;">
              <div class="form-grid">
                <div class="campo form-full"><label>Alimento</label><select id="perdidaAlimento" required></select></div>
                <div class="campo"><label>Cantidad perdida</label><input id="perdidaCantidad" type="number" min="1" required></div>
                <div class="campo"><label>Motivo</label><select id="perdidaMotivo"><option>Vencimiento</option><option>Daño</option><option>Descomposición</option><option>Otro</option></select></div>
                <div class="campo form-full"><label>Observación</label><textarea id="perdidaObservacion" placeholder="Detalle de la pérdida"></textarea></div>
              </div>
              <div class="acciones"><button class="boton-peligro" type="submit">Registrar pérdida</button></div>
              <div id="mensajePerdida" class="mensaje"></div>
            </form>
          </article>
        </div>
        <article class="panel" style="margin-top:20px;">
          <div class="encabezado-panel"><div><span class="etiqueta-seccion">REGISTROS</span><h3>Alimentos registrados</h3></div></div>
          <div class="tabla-contenedor"><table class="tabla"><thead><tr><th>Alimento</th><th>Categoría</th><th>Cantidad</th><th>Vence</th><th>Sede</th><th>Acciones</th></tr></thead><tbody id="tablaAlimentos"></tbody></table></div>
        </article>
      </section>
